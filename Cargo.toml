[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.36"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
api = { path = "crates/api" }
session = { path = "crates/session" }
lyrics = { path = "crates/lyrics" }
client-core = { path = "crates/core" }
player = { path = "crates/player" }
os = { path = "crates/os" }
sonos = { path = "crates/sonos" }
asio = { path = "crates/asio" }
app-ui = { path = "crates/app-ui" }
symphonia = { version = "0.5", default-features = false, features = ["aac", "alac", "flac", "isomp4", "mp3", "ogg", "opt-simd", "pcm", "vorbis", "wav"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "gzip", "http2", "json", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Same proxy matcher reqwest uses; the app hands its result to mpv.
hyper-util = { version = "0.1.21", default-features = false, features = ["client-proxy", "client-proxy-system"] }
http = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
url = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
lru = "0.16"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
bytes = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
# Skip unused Slint `system-tray` (the app uses `os::tray` / `tray-icon` directly).
# Keep all app features unified here so `app-ui` and `app` share identical `slint` fingerprints.
slint = { version = "1.18", default-features = false, features = ["std", "backend-default", "renderer-femtovg", "renderer-software", "accessibility", "compat-1-2", "raw-window-handle-06", "unstable-fontique-011", "unstable-winit-030"] }
slint-build = "1.18"
directories = "6"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wiremock = "0.6"
keyring = "4.2"
souvlaki = { version = "0.9", default-features = false, features = ["use_zbus"] }
tray-icon = { version = "0.26", default-features = false }
raw-window-handle = "0.6"
# Opens 032 web console pages in the default browser.
open = "5"
# Native file dialogs; the portal backend keeps Linux free of GTK.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "pollster"] }
# Sonos control (UPnP SOAP replies, DIDL-Lite) and the SSDP interfaces.
roxmltree = "0.21"
if-addrs = "0.15"
socket2 = "0.6"
ttf-parser = "0.25"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.dev]
# Line tables keep file:line backtraces while cutting object/PDB size and link time.
debug = "line-tables-only"

[profile.dev.package."*"]
# Skip debuginfo for third-party dependencies in dev/test builds.
debug = false

[profile.dev.package.app-ui]
# Skip debuginfo/PDB for the ~290k-line Slint generated module and parallelize codegen in CI.
debug = false
codegen-units = 64

[profile.release]
strip = "debuginfo"

[profile.release.package.app-ui]
# Generated Slint UI glue is not CPU-hot (rendering, decoding, and TLS stay at
# opt-level 3 in their own crates). opt-level 1 + 64 CGUs cuts release build
# time and avoids aggressive inlining bloat across ~25k generated functions.
opt-level = 1
codegen-units = 64
