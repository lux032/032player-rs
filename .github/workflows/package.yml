name: Package

# Portable Windows build for testing (installer comes in M4).
# Run from the Actions tab ("Run workflow"); the zip is attached to the
# "preview" pre-release and kept as a workflow artifact.

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Static CRT: runs without the VC++ redistributable.
  CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: package
      - name: Cache libmpv
        uses: actions/cache@v4
        with:
          path: target/libmpv
          key: libmpv-${{ hashFiles('crates/player/build.rs') }}

      - name: Build
        run: cargo build -p app --release --target x86_64-pc-windows-msvc

      - name: Package
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          $name = "032player-windows-x64-$sha"
          $dir = "dist/$name"
          New-Item -ItemType Directory -Force $dir | Out-Null
          $out = "target/x86_64-pc-windows-msvc/release"
          Copy-Item "$out/032player.exe" $dir
          Copy-Item "$out/libmpv-2.dll" $dir
          @"
          032player $sha (M1 + M2 preview)

          Run 032player.exe. The console window shows the log; keep it with any bug report.
          Optional: set M032_SERVER_URL, M032_API_TOKEN and M032_MEDIA_TOKEN to sign in automatically.

          This build covers M1 (queue, gapless playback, reporting, settings, tray, media keys,
          sleep timer) and M2 (albums / tracks / artists / playlists / favorites lists with sort,
          filters and search, album / artist / playlist pages, favorites, playlist editing with
          artwork upload, similar tracks).
          "@ | Set-Content "$dir/README.txt" -Encoding utf8
          Compress-Archive -Path $dir -DestinationPath "dist/$name.zip"
          "ZIP=dist/$name.zip" >> $env:GITHUB_ENV
          "NAME=$name" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: ${{ env.ZIP }}

      - name: Publish pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete preview --yes --cleanup-tag 2>$null
          gh release create preview "$env:ZIP" --prerelease --target "${{ github.sha }}" `
            --title "Preview ${{ github.sha }}" `
            --notes "Portable Windows build of ${{ github.sha }} for testing. Unzip and run 032player.exe."
